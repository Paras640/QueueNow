services:
  queuenow:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      MONGODB_URI: "${MONGODB_URI:?Set MONGODB_URI in the environment or project .env file}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
    restart: unless-stopped
