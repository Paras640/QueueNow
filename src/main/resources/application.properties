# ==============================================================================
# QueueNow - Application Configuration
# ==============================================================================

# Application Identifier
# Defines the Spring application name used for logging and context identification
spring.application.name=queuenow

# MongoDB Connection URI
# Loaded dynamically from the MONGODB_URI environment variable (e.g., MongoDB Atlas connection string)
spring.mongodb.uri=${MONGODB_URI}

# Target Database Name
# Specifies the MongoDB database instance where collections are stored
spring.data.mongodb.database=queuenow