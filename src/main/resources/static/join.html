
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Queue | QueueNow</title>

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #080808;
    color: #f5f0e8;
    min-height: 100vh;
    background-image:
        radial-gradient(ellipse at 50% 0%, #332716 0%, transparent 55%);
}

header {
    background: rgba(12, 12, 12, 0.9);
    padding: 24px 8%;
    border-bottom: 1px solid #332b20;
}

.logo {
    color: #e5c58a;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -1px;
    text-decoration: none;
}

main {
    max-width: 580px;
    margin: 75px auto;
    padding: 0 20px;
}

.card {
    background: linear-gradient(145deg, #171614, #0e0e0d);
    padding: 42px;
    border: 1px solid #493b27;
    border-radius: 22px;
    box-shadow: 0 25px 80px #00000080;
}

.tag {
    color: #e5c58a;
    background: #292115;
    border: 1px solid #514127;
    padding: 9px 14px;
    display: inline-block;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(30px, 6vw, 43px);
    line-height: 1.2;
    margin-bottom: 16px;
    letter-spacing: -1.5px;
    color: #fffaf0;
}

.description {
    color: #aaa49a;
    line-height: 1.8;
    margin-bottom: 32px;
    font-size: 15px;
}

label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: #e8dfd0;
    margin-bottom: 11px;
}

input {
    width: 100%;
    padding: 16px;
    background: #0a0a0a;
    color: #fffaf0;
    border: 1px solid #40382c;
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 20px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
}

input::placeholder {
    color: #716b61;
}

input:focus {
    border-color: #c6a56a;
    box-shadow: 0 0 0 3px #c6a56a18;
}

button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(110deg, #e8cf9c, #b58b4e);
    color: #17110a;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px #c6a56a35;
}

button:active {
    transform: translateY(0);
}

#message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    line-height: 1.6;
    font-size: 14px;
}

.note {
    text-align: center;
    margin-top: 28px;
    color: #827b70;
    font-size: 12px;
    letter-spacing: 0.5px;
}

@media (max-width: 480px) {
    main {
        margin: 40px auto;
    }

    .card {
        padding: 27px 22px;
    }

    header {
        padding: 20px 6%;
    }
}
    </style>
</head>

<body>
    <header>
        <a class="logo" href="/">QueueNow.</a>
    </header>

    <main>
        <section class="card">
            <span class="tag">CUSTOMER PORTAL</span>

            <h1>Join the queue</h1>

            <p class="description">
                Enter your name to get started.
                Track your turn without standing in a long line.
            </p>

            <form id="joinForm">
                <label for="customerName">Your full name</label>

                <input
                    type="text"
                    id="customerName"
                    name="customerName"
                    placeholder="Enter your name"
                    maxlength="80"
                    required
                >

                <button type="submit">Join Queue →</button>
            </form>

            <div id="message" role="status" aria-live="polite"></div>

            <p class="note">
                QueueNow · Smart waiting starts here
            </p>
        </section>
    </main>

    <script>
    const form = document.getElementById("joinForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("customerName")
            .value.trim();

        if (!name) {
            message.style.display = "block";
            message.textContent = "Please enter your name.";
            return;
        }

        message.style.display = "block";
        message.textContent = "Joining queue...";

        try {
            const response = await fetch("/api/queue/join", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name: name })
            });

            const data = await response.json();

            message.textContent = data.message ||
                "Request completed.";

            message.style.background = response.ok
                ? "#d1fae5"
                : "#fee2e2";

            message.style.color = response.ok
                ? "#065f46"
                : "#991b1b";

        } catch (error) {
            message.style.display = "block";
            message.style.background = "#fee2e2";
            message.style.color = "#991b1b";
            message.textContent =
                "Could not connect to the server. Please try again.";
        }
    });
</script>
</body>
</html>
