
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueueNow | Join Queue</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#e6c78f;--light:#fff0c7;--muted:#aaa49a}
body{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;font-family:Arial,sans-serif;color:#fffaf0;background:
 radial-gradient(ellipse at 20% 10%,#523a1c55,transparent 50%),#080807
}
.card{width:100%;max-width:420px;padding:32px 26px;background:#14110de8;
 border:1px solid #e6c78f55;border-radius:20px;box-shadow:0 20px 60px #0008}
.logo{text-align:center;font-size:30px;font-weight:900;color:var(--gold)}
h2{text-align:center;margin:22px 0 8px}
p{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px}
label{display:block;color:var(--gold);font-size:12px;margin-bottom:8px}
input{width:100%;padding:14px;background:#0b0a08;color:white;border:1px solid #73552a;border-radius:10px;font-size:16px}
button{width:100%;padding:15px;margin-top:16px;border:0;border-radius:10px;
 background:linear-gradient(110deg,#b58b4e,#e6c78f,#99733c);font-size:15px;font-weight:bold;cursor:pointer}
#message{text-align:center;margin-top:14px;color:var(--gold);font-size:14px}
.qr-section {
  margin-top: 22px;
  padding-top: 20px;
  border-top: 1px solid #e6c78f25;
  text-align: center;
}

.qr-section h3 {
  color: var(--gold);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.8px;
  margin-bottom: 8px;
}

.qr-section p {
  max-width: 290px;
  margin: 0 auto 16px;
  color: #aaa49a;
  font-size: 13px;
  line-height: 1.5;
}

.qr-frame {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: #fff;
  border: 1px solid #e6c78f55;
  border-radius: 14px;
  box-shadow: 0 8px 24px #0005;
}

.qr-section img {
  display: block;
  width: 148px;
  height: 148px;
  object-fit: contain;
  border-radius: 4px;
}

.qr-error {
  color: #ff7777;
  font-size: 12px;
  margin-top: 10px;
}
</style>
</head>
<body>
<main class="card">
 <div class="logo">QueueNow<span style="color:var(--light)">.</span></div>
 <h2>Join the Queue</h2>
 <p>Enter your name to receive your token and track your turn live.</p>
 <form id="joinForm">
  <label for="customerName">YOUR NAME</label>
  <input id="customerName" maxlength="80" placeholder="Enter your name" required>
  <button id="joinBtn" type="submit">Join Queue →</button>
 </form>
 <div id="message" role="status"></div>
 <div class="qr-section">
  <h3>SCAN TO JOIN</h3>
  <p>Scan with your phone to join the queue instantly.</p>

  <div class="qr-frame">
    <img
      id="joinQr"
      alt="QueueNow Join Queue QR Code"
      hidden
    >
  </div>

  <div id="qrError" class="qr-error" role="status"></div>
</div>
</main>
<script>
const form=document.getElementById("joinForm");
const btn=document.getElementById("joinBtn");
const message=document.getElementById("message");
const joinQr = document.getElementById("joinQr");
const qrError = document.getElementById("qrError");

async function loadJoinQr() {
  try {
    const response = await fetch("/api/queue/join-qr");

    if (!response.ok) {
      throw new Error("QR endpoint returned " + response.status);
    }

    const contentType = response.headers.get("content-type") || "";

    // Endpoint agar direct image return karta hai
    if (contentType.startsWith("image/")) {
      const imageBlob = await response.blob();
      joinQr.src = URL.createObjectURL(imageBlob);
      joinQr.hidden = false;
      return;
    }

    // Endpoint agar JSON mein QR URL return karta hai
    const data = await response.json();

    const qrUrl =
      data.qrUrl ||
      data.qrCodeUrl ||
      data.imageUrl ||
      data.url;

    if (qrUrl) {
      joinQr.src = qrUrl;
      joinQr.hidden = false;
      return;
    }

    throw new Error("QR response format does not contain an image URL.");
  } catch (error) {
    qrError.textContent =
      "QR load nahi hua. QR controller aur endpoint check karo.";
    console.error("Join QR error:", error);
  }
}

joinQr.addEventListener("load", () => {
  joinQr.hidden = false;
});

joinQr.addEventListener("error", () => {
  joinQr.hidden = true;
  qrError.textContent = "QR image load nahi ho payi.";
});

loadJoinQr();
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const name=document.getElementById("customerName").value.trim();
 if(!name){message.textContent="Please enter your name.";return}
 btn.disabled=true;
 btn.textContent="Joining...";
 message.textContent="";
 try{
  const res=await fetch("/api/queue/join",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.message||"Unable to join queue.");
  localStorage.setItem("myTokenNumber",String(data.tokenNumber));
  localStorage.setItem("myCustomerName",data.customerName||name);
  const params=new URLSearchParams({
   token:String(data.tokenNumber),
   name:data.customerName||name
  });
  window.location.href="/track.html?"+params.toString();
 }catch(err){
  message.textContent=err.message||"Server error. Please try again.";
  btn.disabled=false;
  btn.textContent="Join Queue →";
 }
});
</script>
</body>
</html>
