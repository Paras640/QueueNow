<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueueNow | Join Queue</title>

<style>
:root {
  --gold: #e8c47f;
  --gold-light: #fff0c8;
  --bg: #080806;
  --panel: rgba(22, 18, 13, .96);
  --muted: #aaa49a;
  --border: rgba(232, 196, 127, .25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 16px;
  font-family: Arial, Helvetica, sans-serif;
  color: #fffaf0;
  background:
    radial-gradient(ellipse at 15% 15%, #62451f38, transparent 42%),
    radial-gradient(ellipse at 90% 80%, #9a70201b, transparent 38%),
    var(--bg);
  overflow-x: hidden;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 360px;
  height: 360px;
  border: 1px solid #e8c47f18;
  border-radius: 50%;
  pointer-events: none;
  animation: float 12s ease-in-out infinite alternate;
}

body::before {
  top: 8%;
  left: -240px;
}

body::after {
  right: -250px;
  bottom: 5%;
  animation-delay: -5s;
}

.card {
  position: relative;
  width: 100%;
  max-width: 520px;
  padding: 38px 32px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 26px;
  box-shadow: 0 25px 80px #0009;
  animation: appear .75s ease both;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: shine 5s ease-in-out infinite;
}

.logo {
  text-align: center;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: -1.5px;
  color: var(--gold);
  text-shadow: 0 0 30px #e8c47f25;
}

.logo span {
  color: var(--gold-light);
}

.tagline {
  margin-top: 10px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  margin-top: 32px;
  text-align: center;
  font-size: 28px;
  letter-spacing: -.7px;
}

.intro {
  max-width: 350px;
  margin: 12px auto 30px;
  color: var(--muted);
  text-align: center;
  font-size: 15px;
  line-height: 1.7;
}

label {
  display: block;
  margin-bottom: 10px;
  color: var(--gold);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.8px;
}

input {
  width: 100%;
  padding: 16px;
  outline: none;
  color: #fffaf0;
  background: #0b0a08;
  border: 1px solid #554127;
  border-radius: 13px;
  font-size: 16px;
  transition: border-color .25s, box-shadow .25s;
}

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px #e8c47f12;
}

button {
  font-family: inherit;
}

.join-btn {
  width: 100%;
  padding: 17px;
  margin-top: 20px;
  border: 1px solid #ffe1a2;
  border-radius: 13px;
  color: #171109;
  background: linear-gradient(110deg, #b88d4e, #ffdfa0, #c39a58);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 28px #d5a64d20;
  transition: transform .25s, box-shadow .25s;
}

.join-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px #d5a64d35;
}

.join-btn:disabled {
  cursor: wait;
  opacity: .7;
  transform: none;
}

#message {
  min-height: 20px;
  margin-top: 14px;
  text-align: center;
  color: var(--gold);
  font-size: 13px;
  line-height: 1.5;
}

.qr-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 18px;
  margin-top: 30px;
  border: 1px solid #73552a;
  border-radius: 15px;
  color: var(--gold-light);
  background: rgba(230, 199, 143, .06);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all .25s ease;
}

.qr-toggle:hover {
  background: rgba(230, 199, 143, .15);
  border-color: var(--gold);
  transform: translateY(-2px);
}

.qr-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid #e8c47f55;
  border-radius: 10px;
  font-size: 19px;
}

.qr-panel {
  margin-top: 18px;
  padding: 25px 16px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #100e0b;
  animation: appear .35s ease both;
}

.qr-panel[hidden] {
  display: none !important;
}

.qr-panel h3 {
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 14px;
  margin-bottom: 12px;
}

.qr-panel p {
  max-width: 320px;
  margin: 0 auto 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.qr-frame {
  width: 220px;
  height: 220px;
  max-width: 100%;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 17px;
  background: white;
  overflow: hidden;
}

#qrImage {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#qrImage[hidden] {
  display: none !important;
}

#qrLoading {
  color: #302719;
  font-size: 13px;
}

#qrLoading[hidden],
#qrError[hidden] {
  display: none !important;
}

#qrError {
  color: #ff8585;
  margin-top: 15px;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.footer {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid #ffffff10;
  color: #777166;
  text-align: center;
  font-size: 11px;
  line-height: 1.8;
}

.footer strong {
  color: var(--gold);
  font-weight: 600;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px) scale(.99);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes float {
  from {
    transform: translateY(0) rotate(0deg);
  }
  to {
    transform: translateY(-35px) rotate(12deg);
  }
}

@keyframes shine {
  0%, 65% { left: -100%; }
  100% { left: 150%; }
}

@media (max-width: 480px) {
  .card {
    padding: 30px 21px;
    border-radius: 21px;
  }

  .logo {
    font-size: 31px;
  }

  h1 {
    font-size: 25px;
  }

  .intro {
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<main class="card">

  <div class="logo">QueueNow<span>.</span></div>
  <div class="tagline">SMART QUEUE · LESS WAIT · MORE TIME</div>

  <h1>Join the Queue</h1>
  <p class="intro">
    Enter your name to receive your token and track your turn live.
  </p>

  <form id="joinForm">
    <label for="customerName">YOUR NAME</label>

    <input
      id="customerName"
      name="customerName"
      type="text"
      maxlength="80"
      placeholder="Enter your name"
      autocomplete="name"
      required
    >

    <button class="join-btn" id="joinBtn" type="submit">
      Generate Token <span aria-hidden="true">→</span>
    </button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <!-- Only one QR button -->
  <button
    class="qr-toggle"
    id="qrToggle"
    type="button"
    aria-expanded="false"
    aria-controls="qrPanel"
  >
    <span class="qr-icon" aria-hidden="true">▦</span>
    <span id="qrToggleText">Show QR Code</span>
    <span aria-hidden="true">↗</span>
  </button>

  <!-- Hidden until the QR button is clicked -->
  <section id="qrPanel" class="qr-panel" hidden>
    <h3>SCAN TO JOIN</h3>
    <p>Scan this QR code with your phone camera to open QueueNow.</p>

    <div class="qr-frame">
      <span id="qrLoading">Generating QR code...</span>
      <img id="qrImage" alt="QueueNow Join QR Code" hidden>
    </div>

    <p id="qrError" role="alert" hidden></p>
  </section>

  <footer class="footer">
    © 2026 <strong>QueueNow</strong> · Smart Queue Management
  </footer>

</main>

<script>
const form = document.getElementById("joinForm");
const joinBtn = document.getElementById("joinBtn");
const message = document.getElementById("message");
const nameInput = document.getElementById("customerName");

const qrToggle = document.getElementById("qrToggle");
const qrToggleText = document.getElementById("qrToggleText");
const qrPanel = document.getElementById("qrPanel");
const qrImage = document.getElementById("qrImage");
const qrLoading = document.getElementById("qrLoading");
const qrError = document.getElementById("qrError");

let qrLoaded = false;
let qrLoadingNow = false;

/* Show QR panel and generate the image only when clicked. */
qrToggle.addEventListener("click", async () => {
  const shouldShow = qrPanel.hidden;

  if (!shouldShow) {
    qrPanel.hidden = true;
    qrToggle.setAttribute("aria-expanded", "false");
    qrToggleText.textContent = "Show QR Code";
    return;
  }

  qrPanel.hidden = false;
  qrToggle.setAttribute("aria-expanded", "true");
  qrToggleText.textContent = "Hide QR Code";

  if (!qrLoaded && !qrLoadingNow) {
    await loadQrCode();
  }
});

async function loadQrCode() {
  qrLoadingNow = true;
  qrLoading.hidden = false;
  qrImage.hidden = true;
  qrError.hidden = true;
  qrError.textContent = "";

  try {
    /*
     * Localhost works only on this computer.
     * To scan from a phone, use your computer's LAN IP in the QR URL.
     */
    const joinUrl = new URL("/join.html", window.location.origin).href;
    const qrUrl = "/api/qr?text=" + encodeURIComponent(joinUrl);

    const response = await fetch(qrUrl, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(
        "QR endpoint returned HTTP " + response.status +
        ". Check that the Spring Boot server is running."
      );
    }

    const imageBlob = await response.blob();

    if (!imageBlob.type.startsWith("image/")) {
      throw new Error("The /api/qr endpoint did not return an image.");
    }

    const objectUrl = URL.createObjectURL(imageBlob);

    await new Promise((resolve, reject) => {
      qrImage.onload = resolve;
      qrImage.onerror = () => reject(new Error("QR image could not be displayed."));
      qrImage.src = objectUrl;
    });

    qrLoaded = true;
    qrImage.hidden = false;
    qrLoading.hidden = true;

  } catch (error) {
    console.error("QR loading failed:", error);
    qrLoading.hidden = true;
    qrError.textContent =
      (error.message || "QR code could not be generated.") +
      " Check that GET /api/qr?text=... works in your browser.";
    qrError.hidden = false;

  } finally {
    qrLoadingNow = false;
  }
}

/* Generate a queue token. */
form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = nameInput.value.trim();

  if (!name) {
    message.textContent = "Please enter your name.";
    nameInput.focus();
    return;
  }

  joinBtn.disabled = true;
  joinBtn.textContent = "Generating Token...";
  message.textContent = "";

  try {
    const response = await fetch("/api/queue/join", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Server returned an invalid response. Check Spring Boot logs.");
    }

    if (!response.ok) {
      throw new Error(data.message || "Unable to generate token.");
    }

    if (data.tokenNumber == null) {
      throw new Error("Server did not return a token number.");
    }

    const customerName = data.customerName || name;

    localStorage.setItem("myTokenNumber", String(data.tokenNumber));
    localStorage.setItem("myCustomerName", customerName);

    const params = new URLSearchParams({
      token: String(data.tokenNumber),
      name: customerName
    });

    window.location.href = "/track.html?" + params.toString();

  } catch (error) {
    message.textContent = error.message || "Server error. Please try again.";

    joinBtn.disabled = false;
    joinBtn.innerHTML = 'Generate Token <span aria-hidden="true">→</span>';
  }
});
</script>
</body>
</html>
