<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QueueNow | Join Queue</title>

<style>
:root {
  --gold: #e8c47f;
  --gold-light: #fff0c8;
  --bg: #080806;
  --panel: rgba(22, 18, 13, .96);
  --muted: #aaa49a;
  --border: rgba(232, 196, 127, .25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 16px;
  font-family: Arial, Helvetica, sans-serif;
  color: #fffaf0;
  background:
    radial-gradient(ellipse at 15% 15%, #62451f38, transparent 42%),
    radial-gradient(ellipse at 90% 80%, #9a70201b, transparent 38%),
    var(--bg);
  overflow-x: hidden;
}

body::before,
body::after {
  content: "";
  position: fixed;
  width: 360px;
  height: 360px;
  border: 1px solid #e8c47f18;
  border-radius: 50%;
  pointer-events: none;
  animation: float 12s ease-in-out infinite alternate;
}

body::before {
  top: 8%;
  left: -240px;
}

body::after {
  right: -250px;
  bottom: 5%;
  animation-delay: -5s;
}

.card {
  position: relative;
  width: 100%;
  max-width: 520px;
  padding: 38px 32px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 26px;
  box-shadow: 0 25px 80px #0009;
  animation: appear .75s ease both;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 70%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  animation: shine 5s ease-in-out infinite;
}

.logo {
  text-align: center;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: -1.5px;
  color: var(--gold);
  text-shadow: 0 0 30px #e8c47f25;
}

.logo span {
  color: var(--gold-light);
}

.tagline {
  margin-top: 10px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 3px;
}

h1 {
  margin-top: 32px;
  text-align: center;
  font-size: 28px;
  letter-spacing: -.7px;
}

.intro {
  max-width: 350px;
  margin: 12px auto 30px;
  color: var(--muted);
  text-align: center;
  font-size: 15px;
  line-height: 1.7;
}

label {
  display: block;
  margin-bottom: 10px;
  color: var(--gold);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1.8px;
}

input {
  width: 100%;
  padding: 16px;
  outline: none;
  color: #fffaf0;
  background: #0b0a08;
  border: 1px solid #554127;
  border-radius: 13px;
  font-size: 16px;
  transition: border-color .25s, box-shadow .25s;
}

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px #e8c47f12;
}

button {
  font-family: inherit;
}

.join-btn {
  width: 100%;
  padding: 17px;
  margin-top: 20px;
  border: 1px solid #ffe1a2;
  border-radius: 13px;
  color: #171109;
  background: linear-gradient(110deg, #b88d4e, #ffdfa0, #c39a58);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 28px #d5a64d20;
  transition: transform .25s, box-shadow .25s;
}

.join-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 35px #d5a64d35;
}

.join-btn:disabled {
  cursor: wait;
  opacity: .7;
  transform: none;
}

#message {
  min-height: 20px;
  margin-top: 14px;
  text-align: center;
  color: var(--gold);
  font-size: 13px;
  line-height: 1.5;
}

/* QR toggle button */
.qr-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 17px;
  margin-top: 28px;
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--gold-light);
  background: linear-gradient(135deg, #211a10, #15120e);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .25s ease;
}

.qr-toggle:hover {
  border-color: var(--gold);
  background: #2a2114;
  transform: translateY(-2px);
}

.qr-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid #e8c47f55;
  border-radius: 10px;
  font-size: 19px;
}

.qr-section {
  display: none;
  margin-top: 18px;
  padding: 24px 16px;
  text-align: center;
  background: #100e0b;
  border: 1px solid var(--border);
  border-radius: 18px;
}

.qr-section.visible {
  display: block;
  animation: appear .4s ease both;
}

.qr-title {
  color: var(--gold);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.qr-description {
  max-width: 320px;
  margin: 12px auto 20px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.qr-frame {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 180px;
  height: 180px;
  padding: 12px;
  background: #fff;
  border: 1px solid #e8c47f66;
  border-radius: 17px;
  box-shadow: 0 0 35px #e8c47f12;
}

.qr-frame img {
  display: none;
  width: 155px;
  height: 155px;
  object-fit: contain;
}

.qr-loading {
  color: #262016;
  font-size: 12px;
}

.qr-error {
  display: none;
  margin-top: 14px;
  color: #ff8585;
  font-size: 12px;
  line-height: 1.5;
}

.footer {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid #ffffff10;
  color: #777166;
  text-align: center;
  font-size: 11px;
  line-height: 1.8;
}

.footer strong {
  color: var(--gold);
  font-weight: 600;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(18px) scale(.99);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes float {
  from {
    transform: translateY(0) rotate(0deg);
  }
  to {
    transform: translateY(-35px) rotate(12deg);
  }
}

@keyframes shine {
  0%, 65% { left: -100%; }
  100% { left: 150%; }
}

@media (max-width: 480px) {
  .card {
    padding: 30px 21px;
    border-radius: 21px;
  }

  .logo {
    font-size: 31px;
  }

  h1 {
    font-size: 25px;
  }

  .intro {
    font-size: 14px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
.qr-toggle {
  width: 100%;
  margin-top: 34px;
  padding: 20px;
  border: 1px solid #73552a;
  border-radius: 17px;
  background: rgba(230, 199, 143, 0.06);
  color: #fff0c7;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all .25s ease;
}

.qr-toggle:hover {
  background: rgba(230, 199, 143, 0.15);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px #e6c78f20;
}

.qr-panel {
  margin-top: 20px;
  padding: 28px 20px;
  text-align: center;
  border: 1px solid #73552a80;
  border-radius: 20px;
  background: #0e0c09;
  animation: qrAppear .35s ease;
}

.qr-panel[hidden] {
  display: none;
}

.qr-panel h3 {
  color: #e6c78f;
  letter-spacing: 3px;
  font-size: 15px;
  margin-bottom: 15px;
}

.qr-panel p {
  color: #aaa49a;
  line-height: 1.7;
  margin-bottom: 20px;
}

.qr-frame {
  width: 220px;
  min-height: 220px;
  margin: 0 auto;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20px;
  background: white;
  overflow: hidden;
}

#qrImage {
  width: 100%;
  height: auto;
  display: block;
}

#qrImage[hidden] {
  display: none;
}

#qrLoading {
  color: #302719;
  font-size: 14px;
}

.qr-error {
  color: #ff8585 !important;
  margin-top: 15px !important;
  overflow-wrap: anywhere;
}

@keyframes qrAppear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .qr-panel,
  .qr-toggle {
    animation: none;
    transition: none;
  }
}
</style>
</head>

<body>
<main class="card">

  <div class="logo">QueueNow<span>.</span></div>
  <div class="tagline">SMART QUEUE · LESS WAIT · MORE TIME</div>

  <h1>Join the Queue</h1>
  <p class="intro">
    Enter your name to receive your token and track your turn live.
  </p>

  <form id="joinForm">
    <label for="customerName">YOUR NAME</label>

    <input
      id="customerName"
      name="customerName"
      type="text"
      maxlength="80"
      placeholder="Enter your name"
      autocomplete="name"
      required
    >

    <button class="join-btn" id="joinBtn" type="submit">
      Generate Token <span aria-hidden="true">→</span>
    </button>
  </form>

  <div id="message" role="status" aria-live="polite"></div>

  <!-- QR code appears only when the user clicks this button -->
  <button
    class="qr-toggle"
    id="qrToggle"
    type="button"
    aria-expanded="false"
    aria-controls="qrSection"
  >
    <span class="qr-icon" aria-hidden="true">▦</span>
    <span id="qrToggleText">Show QR Code</span>
    <span aria-hidden="true">↗</span>
  </button>

 <button type="button" id="qrToggleBtn" class="qr-toggle">
  ▦ &nbsp; Show QR Code ↗
</button>

<!-- QR section: hidden until clicked -->
<section id="qrPanel" class="qr-panel" hidden>
  <h3>SCAN TO JOIN</h3>
  <p>Scan this QR code with your phone camera to open QueueNow.</p>


     <div class="qr-frame">
    <div id="qrLoading">Generating QR code...</div>
    <img id="qrImage" alt="QueueNow Join QR Code" hidden>
  </div>

  <p id="qrError" class="qr-error" hidden></p>
</section>

  <footer class="footer">
    © 2026 <strong>QueueNow</strong> · Smart Queue Management
  </footer>

</main>

<script>
const form = document.getElementById("joinForm");
const joinBtn = document.getElementById("joinBtn");
const message = document.getElementById("message");
const nameInput = document.getElementById("customerName");

const qrToggle = document.getElementById("qrToggle");
const qrToggleText = document.getElementById("qrToggleText");
const qrSection = document.getElementById("qrSection");
const qrImage = document.getElementById("qrImage");
const qrError = document.getElementById("qrError");
const qrLoading = document.getElementById("qrLoading");

let qrLoaded = false;
let qrLoadingNow = false;

/* Show/hide QR and generate it only on the first click */
qrToggle.addEventListener("click", async () => {
  const shouldShow = !qrSection.classList.contains("visible");

  if (!shouldShow) {
    qrSection.classList.remove("visible");
    qrToggle.setAttribute("aria-expanded", "false");
    qrToggleText.textContent = "Show QR Code";
    return;
  }

  qrSection.classList.add("visible");
  qrToggle.setAttribute("aria-expanded", "true");
  qrToggleText.textContent = "Hide QR Code";

  if (!qrLoaded && !qrLoadingNow) {
    await loadQrCode();
  }
});

/* This matches your Java controller: GET /api/qr?text=... */
async function loadQrCode() {
  qrLoadingNow = true;
  qrError.style.display = "none";
  qrError.textContent = "";
  qrLoading.style.display = "block";
  qrImage.style.display = "none";

  try {
    /*
      This URL is encoded in the QR.
      It works on the same computer using localhost.
      For phone scanning, use your computer's LAN IP instead.
    */
    const joinUrl = window.location.origin + "/join.html";
    const qrUrl = "/api/qr?text=" + encodeURIComponent(joinUrl);

    await new Promise((resolve, reject) => {
      qrImage.onload = () => resolve();
      qrImage.onerror = () => reject(
        new Error("QR image could not load.")
      );

      qrImage.src = qrUrl;
    });

    qrLoading.style.display = "none";
    qrImage.style.display = "block";
    qrLoaded = true;

  } catch (error) {
    console.error("QR loading failed:", error);

    qrLoading.style.display = "none";
    qrError.textContent =
      "QR code load nahi hua. Backend running hai aur /api/qr endpoint available hai, ye check karo.";
    qrError.style.display = "block";

  } finally {
    qrLoadingNow = false;
  }
}

/* Join queue */
form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = nameInput.value.trim();

  if (!name) {
    message.textContent = "Please enter your name.";
    nameInput.focus();
    return;
  }

  joinBtn.disabled = true;
  joinBtn.textContent = "Joining...";
  message.textContent = "";

  try {
    const response = await fetch("/api/queue/join", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || "Unable to join queue.");
    }

    if (data.tokenNumber == null) {
      throw new Error("Server did not return a token number.");
    }

    const customerName = data.customerName || name;

    localStorage.setItem(
      "myTokenNumber",
      String(data.tokenNumber)
    );

    localStorage.setItem(
      "myCustomerName",
      customerName
    );

    const params = new URLSearchParams({
      token: String(data.tokenNumber),
      name: customerName
    });

    window.location.href = "/track.html?" + params.toString();

  } catch (error) {
    message.textContent =
      error.message || "Server error. Please try again.";

    joinBtn.disabled = false;
    joinBtn.innerHTML =
      'Join Queue <span aria-hidden="true">→</span>';
  }
});
</script>
<script>
(() => {
  const toggleBtn = document.getElementById("qrToggleBtn");
  const panel = document.getElementById("qrPanel");
  const qrImage = document.getElementById("qrImage");
  const loading = document.getElementById("qrLoading");
  const error = document.getElementById("qrError");

  let qrLoaded = false;
  let loadingQr = false;

  toggleBtn.addEventListener("click", async () => {
    // Hide the QR when clicked again
    if (!panel.hidden) {
      panel.hidden = true;
      toggleBtn.innerHTML = "▦ &nbsp; Show QR Code ↗";
      return;
    }

    panel.hidden = false;
    toggleBtn.innerHTML = "▦ &nbsp; Hide QR Code ↗";

    if (qrLoaded || loadingQr) return;

    loadingQr = true;
    loading.hidden = false;
    qrImage.hidden = true;
    error.hidden = true;
    error.textContent = "";

    try {
      // This URL must be reachable from the phone scanning the QR.
      const joinUrl = new URL("/join.html", window.location.origin).href;

      // Your existing QRCodeController returns a PNG from this endpoint.
      const qrUrl = "/api/qr?text=" + encodeURIComponent(joinUrl);

      await new Promise((resolve, reject) => {
        qrImage.onload = resolve;
        qrImage.onerror = () => reject(
          new Error("QR image load nahi hui. Backend endpoint check karo.")
        );
        qrImage.src = qrUrl;
      });

      qrLoaded = true;
      qrImage.hidden = false;
      loading.hidden = true;
    } catch (err) {
      loading.hidden = true;
      error.textContent =
        err.message || "QR generate nahi hua. Server check karke retry karo.";
      error.hidden = false;
    } finally {
      loadingQr = false;
    }
  });
})();
</script>
</body>
</html>
